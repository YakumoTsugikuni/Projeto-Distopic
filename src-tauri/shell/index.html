<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Distopic</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #1b1c1e; color: #e6e6e8; font-family: "Segoe UI", system-ui, sans-serif;
      display: grid; place-items: center; text-align: center; user-select: none;
    }
    h1 { margin: 0.8rem 0 0.3rem; letter-spacing: 0.35em; font-size: 1.5rem; color: #fff; }
    #status { color: #9a9ba1; font-size: 0.9rem; }
    #status.error { color: #ff8088; max-width: 520px; line-height: 1.5; user-select: text; }
    .dot { display: inline-block; width: 8px; height: 8px; margin-right: 0.4rem; border-radius: 50%; background: #d4252f; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.25; } }
  </style>
  <script>
    // Chamado pelo aplicativo (Rust) se o backend não subir.
    function showError(message) {
      const status = document.getElementById("status");
      status.className = "error";
      status.textContent = message;
    }
  </script>
</head>
<body>
  <main>
    <img src="logo.png" alt="" width="128" height="128">
    <h1>DISTOPIC</h1>
    <p id="status"><span class="dot"></span>Iniciando sistemas…</p>
  </main>
</body>
</html>
